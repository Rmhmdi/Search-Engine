<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>گوگولی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amarante&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            background-color: #e3e7e6;
        }
        
        .search-container {
            position: relative;
            width: 400px;
            max-width: 100%;
        }

        .search-container svg {
            position: absolute;
            top: 50%;
            right: 430px;
            transform: translateY(-50%);
            cursor: pointer;
            
        }

        .search-container .title {
            font-family: 'Amarante', cursive;
            font-size: 50px;
            font-weight: bold;
            color: #666666;
            position: absolute;
            top: -80px; 
            right: 60%; 
            transform: translateX(50%);
        }

        .search-container .title .leaf {
            font-size: 24px;
            position: absolute;
            top: -10px;
            left: 30px;
        }

        input[type="text"] {
            padding: 10px 20px 15px 45px;
            font-size: 14px;
            line-height: 22px;
            color: #505152;
            vertical-align: middle;
            background-color: #ffffff;
            background-repeat: no-repeat;
            background-position: left 8px center;
            border: 3px solid #208053;
            border-radius: 6px;
            outline: none;
            box-shadow: rgba(225, 228, 232, 0.2) 0px 1px 0px 0px inset;
            width: 100%;
            max-width: 400px;
        }

        form {
            display: flex;
            gap: 0;
        }

        #suggestions {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            max-width: 400px;
            position: absolute;
            top: 100%;
            left: -40px; 
            z-index: 10;
            display: none; 
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .suggestion {
            background-color: #f8f8f8;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            color: #333;
            padding: 8px 12px;
            margin: 5px 0;
            cursor: pointer;
            transition: background-color 0.3s, padding-left 0.3s;
        }

        .suggestion:hover {
            background-color: #f0f0f0;
            padding-left: 20px; 
        }

        .suggestion:active {
            background-color: #e1e4e8;
        }

        input[type="text"]:focus {
            border-color: #0366d6;
            outline: none;
            box-shadow: rgba(3, 102, 214, 0.3) 0px 0px 0px 3px;
        }
    </style>
</head>
<body>
    <form method="POST">
        <div class="search-container">
            <div class="title">GooGooli</div>
            <input type="text" id="query" name="query" placeholder="عبارت مورد نظر خود را وارد کنید" oninput="getSuggestions(this.value)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24" id="search-icon">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>            
            <div id="suggestions"></div> 
        </div>
    </form>

    <script>
        
        document.getElementById('search-icon').addEventListener('click', function () {
        const queryInput = document.getElementById('query');

         if (queryInput.value.trim() === '') {
             alert('لطفاً عبارت جستجو را وارد کنید.');
             return;
             }

         document.querySelector('form').submit();
        });


        document.getElementById('query').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                 event.preventDefault(); 
                 document.querySelector('form').submit(); 
            }
        });

        function getSuggestions(query) {
            if (!query) {
                document.getElementById('suggestions').style.display = 'none';  
                return;
            }

            fetch(`/suggest?query=${query}`)
                .then(response => response.json())
                .then(suggestions => {
                    const suggestionsContainer = document.getElementById('suggestions');
                    suggestionsContainer.innerHTML = ''; 
                    if (suggestions.length > 0) {
                        suggestionsContainer.style.display = 'block'; 
                        suggestions.forEach(suggestion => {
                            const div = document.createElement('div');
                            div.textContent = suggestion;
                            div.classList.add('suggestion');
                            div.onclick = function() {
                                const queryInput = document.getElementById('query');
                                let queryWords = queryInput.value.split(' ');
                                queryWords.pop();
                                queryInput.value = [...queryWords, suggestion].join(' ');
                                suggestionsContainer.innerHTML = '';
                                suggestionsContainer.style.display = 'none'; 
                            };
                            suggestionsContainer.appendChild(div);
                        });
                    } else {
                        suggestionsContainer.style.display = 'none'; 
                    }
                });
        }
    </script>
</body>
</html>
